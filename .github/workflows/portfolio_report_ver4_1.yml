name: Daily Portfolio Report ver 4.1

on:
  # schedule:
  #   - cron: '0 14 * * 1-5'
  #   - cron: '0 17 * * 1-5'
  #   - cron: '0 20 * * 1-5'
  workflow_dispatch: {}       # 지금처럼 Apps Script가 호출하거나 수동 실행

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ver4.txt

      - name: Write Google credentials (from Secrets)
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > service_account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/service_account.json" >> $GITHUB_ENV

      - name: Run report
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # 선택: 비용을 줄이려면 아래 두 줄로 AI 브리핑을 끄거나 모델을 바꿀 수 있음
          # ENABLE_AI_BRIEFING: '0'
          # BRIEFING_MODEL: 'claude-haiku-5-5'
        run: |
          python Portfolio_Report_ver_4_1.py

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: portfolio-report-${{ github.run_id }}
          path: portfolio_daily_report_*.html
