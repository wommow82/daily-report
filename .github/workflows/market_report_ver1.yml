name: Market & Stocks Report ver 1

on:
  workflow_dispatch: {}       # Apps Script가 매일 아침 이 워크플로(market_report_ver1.yml)를 호출하거나 수동 실행

jobs:
  build-and-send:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements_ver4.txt

      - name: Write Google credentials (from Secrets)
        run: |
          echo '${{ secrets.GOOGLE_APPLICATION_CREDENTIALS_JSON }}' > service_account.json
          echo "GOOGLE_APPLICATION_CREDENTIALS=$PWD/service_account.json" >> $GITHUB_ENV

      - name: Run report
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          EMAIL_SENDER: ${{ secrets.EMAIL_SENDER }}
          EMAIL_PASSWORD: ${{ secrets.EMAIL_PASSWORD }}
          EMAIL_RECEIVER: ${{ secrets.EMAIL_RECEIVER }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          NEWS_API_KEY: ${{ secrets.NEWS_API_KEY }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          # 선택: AI 비용을 0으로 하려면 아래 줄의 주석을 풀기 / 모델을 바꾸려면 BRIEFING_MODEL
          # ENABLE_AI_BRIEFING: '0'
          # BRIEFING_MODEL: 'claude-haiku-5-5'
          # 뉴스 섹션을 통째로 끄려면: ENABLE_MARKET_NEWS: '0'  /  큰 변동 기준(%) 바꾸려면: MOVER_PCT: '4'
        run: |
          python Market_Report_ver_1.py

      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: market-report-${{ github.run_id }}
          path: market_report_*.html
